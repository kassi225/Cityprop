{% load static %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    :root {
        --cityprop-teal: #00C9A7;
        --dark-bg: #05111d;
        --error-red: #ff453a;
        --glass-bg: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.1);
    }

    body, html {
        margin: 0; padding: 0;
        width: 100%; height: 100vh;
        background-color: var(--dark-bg);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        color: white;
        overflow: hidden;
    }

    .auth-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        height: 100vh;
        width: 100%;
    }

    /* SECTION GAUCHE */
    .form-section {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 40px;
        background: var(--dark-bg);
    }

    .login-box {
        width: 100%;
        max-width: 360px;
    }

    /* ANIMATIONS D'ENTRÉE */
    .ani-1 { animation: appleReveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
    .ani-2 { animation: appleReveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s forwards; opacity: 0; }
    .ani-3 { animation: appleReveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.2s forwards; opacity: 0; }
    .ani-4 { animation: appleReveal 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards; opacity: 0; }

    @keyframes appleReveal {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .brand-logo {
        width: 65px;
        margin-bottom: 30px;
        filter: drop-shadow(0 10px 20px rgba(0, 201, 167, 0.2));
    }

    .sub-heading {
        color: rgba(255, 255, 255, 0.5);
        font-size: 16px;
        margin-bottom: 40px;
        font-weight: 400;
        letter-spacing: -0.2px;
    }

    /* ZERO FOND BLANC - CHAMPS INCRUSTÉS */
    .input-wrapper {
        position: relative;
        margin-bottom: 20px;
    }

    .input-wrapper input {
        width: 100%;
        padding: 18px 22px;
        background: var(--glass-bg); /* Translucide uniquement */
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        color: white;
        font-size: 16px;
        outline: none;
        transition: all 0.3s ease;
        box-sizing: border-box;
    }

    /* Suppression de l'autofill blanc de Google Chrome */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus {
        -webkit-text-fill-color: white !important;
        -webkit-box-shadow: 0 0 0px 1000px var(--dark-bg) inset !important;
        transition: background-color 5000s ease-in-out 0s;
    }

    .input-wrapper input:focus {
        border-color: var(--cityprop-teal);
        background: rgba(255, 255, 255, 0.08);
    }

    .toggle-password {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.3);
        cursor: pointer;
        z-index: 5;
    }

    .btn-submit {
        width: 100%;
        padding: 18px;
        background: var(--cityprop-teal);
        border: none;
        border-radius: 18px;
        color: white;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        margin-top: 10px;
    }

    .btn-submit:hover {
        transform: scale(1.02);
        filter: brightness(1.1);
    }

    /* SECTION IMAGE (DROITE) */
    .image-section {
        position: relative;
        background: url("{% static 'images/bg_login.png' %}") no-repeat center center;
        background-size: cover;
        animation: imageFadeIn 1.5s ease;
    }

    @keyframes imageFadeIn {
        from { opacity: 0; filter: grayscale(100%); }
        to { opacity: 1; filter: grayscale(0%); }
    }

    .image-section::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to right, var(--dark-bg) 0%, transparent 60%);
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
        .auth-grid { grid-template-columns: 1fr; }
        .image-section { display: none; }
    }
</style>

<div class="auth-grid">
    <section class="form-section">
        <div class="login-box">
            <div class="ani-1">
                <img src="{% static 'images/cityprop_logo.png' %}" class="brand-logo" alt="CityProp">
            </div>
            
            <div class="ani-2">
                <p class="sub-heading">Accédez à votre espace professionnel.</p>
            </div>

            {% if error %}
            <div class="error-toast ani-2">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                
                <div class="input-wrapper ani-3">
                    <input type="text" name="username" placeholder="Identifiant" required autocomplete="off">
                </div>

                <div class="input-wrapper ani-3">
                    <input type="password" name="password" id="passwordField" placeholder="Mot de passe" required>
                    <i class="fa-solid fa-eye toggle-password" id="eyeIcon"></i>
                </div>

                <div class="ani-4">
                    <button type="submit" class="btn-submit">Se connecter</button>
                </div>
            </form>
        </div>
    </section>

    <section class="image-section"></section>
</div>

<script>
    const passwordField = document.getElementById('passwordField');
    const eyeIcon = document.getElementById('eyeIcon');

    eyeIcon.addEventListener('click', () => {
        const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordField.setAttribute('type', type);
        eyeIcon.classList.toggle('fa-eye');
        eyeIcon.classList.toggle('fa-eye-slash');
    });
</script>

{% endblock %}
