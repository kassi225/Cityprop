{% load static %}
{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    :root {
        --cityprop-teal: #00C9A7;
        --input-bg: #EBF1FF;
    }

    body, html {
        margin: 0; padding: 0;
        width: 100%; height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
    }

    /* 1. LE FOND : Utilisation de ton fichier bg_login.png */
    .dashboard-preview {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: url("{% static 'images/bg_login1.png' %}") no-repeat center center;
        background-size: cover;
        z-index: -2;
    }

    /* 2. L'EFFET VIGNETTAGE : Sombre sur les bords pour faire ressortir le popup */
    .vignette-overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        /* Dégradé radial : transparent au centre, noir transparent sur les bords */
        background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%);
        backdrop-filter: blur(5px); /* Un petit flou pour le côté pro */
        -webkit-backdrop-filter: blur(5px);
        z-index: -1;
    }

    /* 3. CENTRAGE DU POPUP */
    .auth-container {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(0, 0, 0, 0.1); /* Voile global très léger */
    }

    /* 4. LE POPUP (Style Pinterest / Apple) */
    .login-modal {
        background: #FFFFFF;
        width: 90%;
        max-width: 440px;
        padding: 50px 40px;
        border-radius: 35px; /* Bords très arrondis */
        box-shadow: 0 25px 80px rgba(0,0,0,0.5);
        text-align: center;
        animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(40px) scale(0.9); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .logo-wrapper {
        width: 75px; height: 75px;
        margin: 0 auto 20px;
        background: white;
        border-radius: 18px;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    .login-modal h2 {
        color: #1a1a1a;
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
    }

    .login-modal p {
        color: #777;
        font-size: 15px;
        margin-bottom: 35px;
    }

    /* 5. FORMULAIRE ET INPUTS */
    .form-group {
        position: relative;
        margin-bottom: 18px;
    }

    .form-group input {
        width: 100%;
        padding: 18px 22px;
        background: var(--input-bg);
        border: 2px solid transparent;
        border-radius: 18px;
        font-size: 16px;
        color: #333;
        outline: none;
        box-sizing: border-box;
        transition: all 0.3s ease;
    }

    .form-group input:focus {
        border-color: var(--cityprop-teal);
        background: #fff;
        box-shadow: 0 0 0 5px rgba(0, 201, 167, 0.1);
    }

    /* 6. BOUTON SE CONNECTER */
    .btn-submit {
        width: 100%;
        padding: 18px;
        background: var(--cityprop-teal);
        color: white;
        border: none;
        border-radius: 50px; /* Style Pilule */
        font-weight: 700;
        font-size: 17px;
        cursor: pointer;
        margin-top: 15px;
        transition: all 0.3s ease;
    }

    .btn-submit:hover {
        filter: brightness(1.05);
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 201, 167, 0.3);
    }

    .toggle-password {
        position: absolute;
        right: 22px;
        top: 50%;
        transform: translateY(-50%);
        color: #999;
        cursor: pointer;
    }
</style>

<div class="dashboard-preview"></div>

<div class="vignette-overlay"></div>

<div class="auth-container">
    <div class="login-modal">
        <div class="logo-wrapper">
            <img src="{% static 'images/cityprop_logo.png' %}" width="60" alt="Logo">
        </div>
        
        <h2>CityProp</h2>
        <p>Veuillez vous authentifier pour continuer</p>

        <form method="POST">
            {% csrf_token %}
            
            {% if error %}
            <div style="color: #ff453a; background: rgba(255,69,58,0.1); padding: 10px; border-radius: 12px; margin-bottom: 20px; font-size: 14px;">
                <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
            </div>
            {% endif %}

            <div class="form-group">
                <input type="text" name="username" placeholder="Identifiant" required autofocus>
            </div>

            <div class="form-group">
                <input type="password" name="password" id="passwordInput" placeholder="Mot de passe" required>
                <i class="fa-solid fa-eye toggle-password" id="eyeBtn"></i>
            </div>

            <button type="submit" class="btn-submit">Se connecter</button>
        </form>

        <div style="margin-top: 30px;">
            <a href="#" style="color: #bbb; text-decoration: none; font-size: 13px; font-weight: 500;">
                <i class="fa-solid fa-headset"></i> CityProp|2025
            </a>
        </div>
    </div>
</div>

<script>
    // Gestion de l'affichage du mot de passe
    const passwordInput = document.getElementById('passwordInput');
    const eyeBtn = document.getElementById('eyeBtn');

    eyeBtn.addEventListener('click', () => {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        eyeBtn.classList.toggle('fa-eye');
        eyeBtn.classList.toggle('fa-eye-slash');
    });
</script>

{% endblock %}
