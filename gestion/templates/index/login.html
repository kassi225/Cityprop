{% load static %}
{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    :root {
        --cityprop-teal: #00C9A7;
        --input-bg: #EBF1FF;
    }

    body, html {
        margin: 0; padding: 0;
        width: 100%; height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
    }

    .dashboard-preview {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: url("{% static 'images/bg_login1.png' %}") no-repeat center center;
        background-size: cover;
        z-index: -2;
    }

    .vignette-overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.7) 100%);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        z-index: -1;
    }

    .auth-container {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-modal {
        background: #FFFFFF;
        width: 90%;
        max-width: 440px;
        padding: 50px 40px;
        border-radius: 35px;
        box-shadow: 0 25px 80px rgba(0,0,0,0.5);
        text-align: center;
        animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(40px) scale(0.9); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* --- STYLE DU BOUTON ET ANIMATION --- */
    .btn-submit {
        position: relative;
        width: 100%;
        padding: 18px;
        background: var(--cityprop-teal);
        color: white;
        border: none;
        border-radius: 50px;
        font-weight: 700;
        font-size: 17px;
        cursor: pointer;
        margin-top: 15px;
        transition: all 0.3s ease;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .btn-submit:hover:not(:disabled) {
        filter: brightness(1.05);
        transform: translateY(-2px);
    }

    /* État désactivé pendant le chargement */
    .btn-submit:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
    }

    /* Le petit cercle qui tourne */
    .spinner {
        display: none; /* Caché par défaut */
        width: 20px;
        height: 20px;
        border: 3px solid rgba(255,255,255,0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 1s ease-in-out infinite;
        margin-left: 10px;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* Quand on ajoute la classe 'loading' via JS */
    .btn-submit.loading .btn-text {
        opacity: 0.7;
    }
    .btn-submit.loading .spinner {
        display: inline-block;
    }

    /* --- FIN STYLE ANIMATION --- */

    .logo-wrapper {
        width: 75px; height: 75px;
        margin: 0 auto 20px;
        background: white;
        border-radius: 18px;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    .form-group { position: relative; margin-bottom: 18px; }
    .form-group input {
        width: 100%;
        padding: 18px 22px;
        background: var(--input-bg);
        border: 2px solid transparent;
        border-radius: 18px;
        font-size: 16px;
        outline: none;
        box-sizing: border-box;
        transition: 0.3s;
    }

    .form-group input:focus {
        border-color: var(--cityprop-teal);
        background: #fff;
    }

    .toggle-password {
        position: absolute;
        right: 22px; top: 50%;
        transform: translateY(-50%);
        color: #999;
        cursor: pointer;
    }
</style>

<div class="dashboard-preview"></div>
<div class="vignette-overlay"></div>

<div class="auth-container">
    <div class="login-modal">
        <div class="logo-wrapper">
            <img src="{% static 'images/cityprop_logo.png' %}" width="60" alt="Logo">
        </div>
        
        <h2 style="font-weight: 800;">CityProp</h2>
        <p style="color: #777; margin-bottom: 35px;">Veuillez vous authentifier</p>

        <form method="POST" id="loginForm">
            {% csrf_token %}
            
            {% if error %}
            <div style="color: #ff453a; background: rgba(255,69,58,0.1); padding: 10px; border-radius: 12px; margin-bottom: 20px; font-size: 14px;">
                <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
            </div>
            {% endif %}

            <div class="form-group">
                <input type="text" name="username" placeholder="Identifiant" required autofocus>
            </div>

            <div class="form-group">
                <input type="password" name="password" id="passwordInput" placeholder="Mot de passe" required>
                <i class="fa-solid fa-eye toggle-password" id="eyeBtn"></i>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text">Se connecter</span>
                <div class="spinner"></div>
            </button>
        </form>

        <div style="margin-top: 30px;">
            <a href="#" style="color: #bbb; text-decoration: none; font-size: 13px;">
                <i class="fa-solid fa-headset"></i> CityProp|2025
            </a>
        </div>
    </div>
</div>

<script>
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const passwordInput = document.getElementById('passwordInput');
    const eyeBtn = document.getElementById('eyeBtn');

    // 1. Animation au clic
    loginForm.addEventListener('submit', function() {
        // Ajouter la classe de chargement pour afficher le spinner
        submitBtn.classList.add('loading');
        // Désactiver le bouton pour éviter le double clic
        submitBtn.disabled = true;
        // Optionnel : Changer le texte
        submitBtn.querySelector('.btn-text').innerText = "Connexion...";
    });

    // 2. Gestion de l'œil (Mot de passe)
    eyeBtn.addEventListener('click', () => {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        eyeBtn.classList.toggle('fa-eye');
        eyeBtn.classList.toggle('fa-eye-slash');
    });
</script>

{% endblock %}
